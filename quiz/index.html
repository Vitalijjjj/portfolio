<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Опитування</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f6f6">
  <meta name="description" content="Коротке опитування — допоможіть зробити контент кращим.">
  <link rel="preload" href="fonts/Inter-var-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="quiz.css">
</head>
<body>

  <!-- Прелоадер: чорна рамка з відсотком + шкала завантаження -->
  <div class="ql" id="ql" role="status" aria-label="Завантаження">
    <div class="ql__frame">
      <video class="ql__video" src="media/preloader.mp4" poster="media/preloader-poster.jpg"
             autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
    </div>
    <div class="ql__bar"><i class="ql__fill"></i></div>
    <div class="ql__label">Завантаження</div>
  </div>

  <main class="quiz" id="quiz" aria-live="polite">

    <header class="quiz__top">
      <div class="quiz__brand">
        <span class="quiz__dot" aria-hidden="true"></span>
        <span>Опитування</span>
      </div>
      <div class="quiz__progress" role="progressbar" aria-label="Прогрес" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i class="quiz__progress-fill"></i>
      </div>
      <div class="quiz__count"><b>0</b><span>/</span><i>0</i></div>
    </header>

    <!-- Кроки рендеряться з JS -->
    <section class="quiz__stage" id="stage"></section>

    <footer class="quiz__nav">
      <button type="button" class="quiz__back" id="back" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        Назад
      </button>
      <button type="button" class="quiz__next" id="next">
        <span>Далі</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </footer>

    <!-- Пастка для ботів -->
    <input class="quiz__hp" type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  </main>

  <!-- Екран подяки -->
  <div class="done" id="done" hidden>
    <div class="done__card">
      <div class="done__check" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1>Дякуємо!</h1>
      <p id="done-text">Ваші відповіді надіслано. Це справді допоможе зробити контент кращим 🙏</p>
    </div>
  </div>

  <script>
    // Прелоадер: анімуємо шкалу, фініш — коли готові шрифти (з мін. часом показу)
    (function () {
      var ql = document.getElementById("ql");
      if (!ql) return;
      var fill = ql.querySelector(".ql__fill");
      var start = Date.now(), value = 0, done = false, tick;

      function paint(v) {
        fill.style.width = Math.round(v) + "%";
      }
      tick = setInterval(function () {
        value += (90 - value) * 0.08 + 0.5;
        if (value > 90) value = 90;
        paint(value);
      }, 30);

      function finish() {
        if (done) return; done = true;
        clearInterval(tick);
        var t = setInterval(function () {
          value += (100 - value) * 0.35 + 2;
          if (value >= 100) { value = 100; paint(100); clearInterval(t); hide(); }
          else paint(value);
        }, 20);
      }
      function hide() {
        setTimeout(function () {
          ql.classList.add("is-hidden");
          setTimeout(function () { if (ql.parentNode) ql.parentNode.removeChild(ql); }, 450);
        }, 220);
      }
      function ready() {
        setTimeout(finish, Math.max(0, 900 - (Date.now() - start)));
      }

      if (document.fonts && document.fonts.ready) document.fonts.ready.then(ready);
      else window.addEventListener("load", ready);
      setTimeout(ready, 2500); // страховка — ніколи не зависаємо
    })();
  </script>

  <script src="quiz.js" defer></script>
</body>
</html>
